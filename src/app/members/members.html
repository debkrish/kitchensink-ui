<mat-card class="member-card">
  <mat-card-header>
    <mat-card-title>Members</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <!-- Add Member Form -->
    <form (ngSubmit)="addMember()" #memberForm="ngForm" class="member-form">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput type="text" [(ngModel)]="newMember.name" name="name" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" [(ngModel)]="newMember.email" name="email" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Phone</mat-label>
        <input matInput type="text" [(ngModel)]="newMember.phoneNumber" name="phoneNumber" required />
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="memberForm.invalid">
        Add Member
      </button>
    </form>

    <mat-divider></mat-divider>

    <!-- Members Table -->
    @if (members.length > 0) {
      <table mat-table [dataSource]="members" class="mat-elevation-z8 member-table">

        <!-- ID Column (Read-only) -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> ID </th>
          <td mat-cell *matCellDef="let m"> {{ m.id }} </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Name </th>
          <td mat-cell *matCellDef="let m">
            <input matInput [(ngModel)]="m.name" [disabled]="!m.editing" />
          </td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef> Email </th>
          <td mat-cell *matCellDef="let m">
            <input matInput [(ngModel)]="m.email" [disabled]="!m.editing" />
          </td>
        </ng-container>

        <!-- Phone Column -->
        <ng-container matColumnDef="phoneNumber">
          <th mat-header-cell *matHeaderCellDef> Phone </th>
          <td mat-cell *matCellDef="let m">
            <input matInput [(ngModel)]="m.phoneNumber" [disabled]="!m.editing" />
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let m">
              <button mat-button color="primary" *ngIf="!m.editing" (click)="startEdit(m)">Edit</button>
              <button mat-button color="accent" *ngIf="m.editing" (click)="updateMember(m)">Save</button>
              <button mat-button color="warn" (click)="deleteMember(m.id)">Delete</button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['id','name','email','phoneNumber','actions']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['id','name','email','phoneNumber','actions'];"></tr>
      </table>
    } @else {
      <p>No members available.</p>
    }
  </mat-card-content>
</mat-card>
